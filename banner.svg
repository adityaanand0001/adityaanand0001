<svg width="880" height="500" viewBox="0 0 880 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #111111; }

      .headline {
        font-family: 'Arial Narrow', 'Impact', 'Helvetica Neue Condensed', 'Arial Black', sans-serif;
        font-size: 68px; fill: #ffffff; font-weight: 700; letter-spacing: -1px;
      }

      .subhead {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 18px; fill: #9e9ea0; font-weight: 600; letter-spacing: 0.5px;
      }
      .tagline {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px; fill: #707072; font-weight: 500;
      }
      .meta-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 11px; fill: #ffffff; font-weight: 500; opacity: 0.35;
      }

      /* boxy buttons — premium subtle rx=6 */
      .btn-white-bg  { fill: #ffffff; }
      .btn-dark-bg   { fill: #f5f5f5; fill-opacity: 0.08; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.1; }
      .btn-white-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px; fill: #111111; font-weight: 600;
      }
      .btn-dark-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px; fill: #ffffff; fill-opacity: 0.6; font-weight: 500;
      }

      /* skill chips */
      .chip-white-bg  { fill: #ffffff; }
      .chip-dark-bg   { fill: #f5f5f5; fill-opacity: 0.08; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.1; }
      .chip-white-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px; fill: #111111; font-weight: 600;
      }
      .chip-dark-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px; fill: #ffffff; fill-opacity: 0.6; font-weight: 500;
      }

      .hairline { stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.06; }

      /* visitor count card — right side, replaces lines */
      .visitor-box { fill: #f5f5f5; fill-opacity: 0.06; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.08; }
      .visitor-number {
        font-family: 'Arial Narrow', 'Impact', 'Helvetica Neue Condensed', sans-serif;
        font-size: 48px; fill: #ffffff; font-weight: 700;
      }
      .visitor-label {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px; fill: #ffffff; fill-opacity: 0.4; font-weight: 600; letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="880" height="500" class="bg"/>

  <!-- utility strip -->
  <rect x="0" y="0" width="880" height="34" fill="#ffffff" fill-opacity="0.02"/>
  <text x="36" y="21" class="meta-text">ADITYA ANAND  ·  AI ENGINEER  ·  SDE-1</text>

  <!-- ═══════════════════════════ VISITOR COUNT — right side ═══════════════════ -->
  <rect x="660" y="60" width="190" height="130" rx="8" class="visitor-box"/>
  <text x="755" y="115" class="visitor-number" text-anchor="middle">—</text>
  <text x="755" y="150" class="visitor-label" text-anchor="middle">PROFILE VIEWS</text>

  <!-- ═══════════════════════════ TYPOGRAPHY ═══════════════════════════════════ -->

  <text x="36" y="150" class="headline">ADITYA</text>
  <text x="36" y="210" class="headline">ANAND</text>

  <text x="36" y="252" class="subhead">AI ENGINEER  |  SDE-1</text>
  <text x="36" y="280" class="tagline">Autonomous agents. Intelligent systems. Clean code.</text>

  <!-- CTA buttons — integrated -->
  <rect x="36" y="316" width="160" height="42" rx="6" class="btn-white-bg"/>
  <text x="116" y="343" class="btn-white-text" text-anchor="middle">GET IN TOUCH</text>

  <rect x="208" y="316" width="140" height="42" rx="6" class="btn-dark-bg"/>
  <text x="278" y="343" class="btn-dark-text" text-anchor="middle">LINKEDIN</text>

  <rect x="360" y="316" width="170" height="42" rx="6" class="btn-dark-bg"/>
  <text x="445" y="343" class="btn-dark-text" text-anchor="middle">VIEW REPOSITORIES</text>


  <!-- divider -->
  <line x1="36" y1="394" x2="844" y2="394" class="hairline"/>

  <!-- ═══════════════════════════ TECH STACK ═══════════════════════════════════ -->

  <text x="36" y="430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="600" opacity="0.55">TECH STACK</text>

  <!-- Row 1 — white chips -->
  <rect x="36" y="444" width="72" height="28" rx="5" class="chip-white-bg"/>
  <text x="72" y="463" class="chip-white-text" text-anchor="middle">Python</text>

  <rect x="120" y="444" width="82" height="28" rx="5" class="chip-white-bg"/>
  <text x="161" y="463" class="chip-white-text" text-anchor="middle">TypeScript</text>

  <rect x="214" y="444" width="62" height="28" rx="5" class="chip-white-bg"/>
  <text x="245" y="463" class="chip-white-text" text-anchor="middle">React</text>

  <rect x="288" y="444" width="74" height="28" rx="5" class="chip-white-bg"/>
  <text x="325" y="463" class="chip-white-text" text-anchor="middle">Next.js</text>

  <rect x="374" y="444" width="82" height="28" rx="5" class="chip-white-bg"/>
  <text x="415" y="463" class="chip-white-text" text-anchor="middle">Node.js</text>

  <!-- Row 2 — dark chips -->
  <rect x="36" y="484" width="78" height="26" rx="5" class="chip-dark-bg"/>
  <text x="75" y="502" class="chip-dark-text" text-anchor="middle">LangChain</text>

  <rect x="126" y="484" width="90" height="26" rx="5" class="chip-dark-bg"/>
  <text x="171" y="502" class="chip-dark-text" text-anchor="middle">LLMs / RAG</text>

  <rect x="228" y="484" width="64" height="26" rx="5" class="chip-dark-bg"/>
  <text x="260" y="502" class="chip-dark-text" text-anchor="middle">Docker</text>

  <rect x="304" y="484" width="50" height="26" rx="5" class="chip-dark-bg"/>
  <text x="329" y="502" class="chip-dark-text" text-anchor="middle">AWS</text>

  <rect x="366" y="484" width="86" height="26" rx="5" class="chip-dark-bg"/>
  <text x="409" y="502" class="chip-dark-text" text-anchor="middle">PostgreSQL</text>

  <rect x="464" y="484" width="78" height="26" rx="5" class="chip-dark-bg"/>
  <text x="503" y="502" class="chip-dark-text" text-anchor="middle">MongoDB</text>

</svg>
