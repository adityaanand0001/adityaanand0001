<svg width="960" height="480" viewBox="0 0 960 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700&amp;display=swap');

      .bg { fill: #111111; }

      /* editorial geometric "photography" — Nike campaign stand-in */
      .geo { fill: none; stroke: #ffffff; }
      .geo-thick { fill: none; stroke: #ffffff; stroke-width: 2; stroke-opacity: 0.06; }
      .geo-med  { fill: none; stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.04; }
      .geo-fine { fill: none; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.03; }

      /* display headline — Bebas Neue, 96px, uppercase, white, line-height 0.9 */
      .headline {
        font-family: 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;
        font-size: 96px;
        fill: #ffffff;
        font-weight: 400;
        letter-spacing: 0px;
      }

      /* subhead — Inter, 22px, stone */
      .subhead {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 22px;
        fill: #9e9ea0;
        font-weight: 600;
      }

      /* tagline — Inter, 16px, mute */
      .tagline {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        fill: #707072;
        font-weight: 500;
      }

      /* pill CTA — primary (canvas / white pill) */
      .pill-primary-bg { fill: #ffffff; }
      .pill-primary-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        fill: #111111;
        font-weight: 600;
      }

      /* pill CTA — secondary (soft-cloud pill) */
      .pill-secondary-bg { fill: #f5f5f5; }
      .pill-secondary-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        fill: #111111;
        font-weight: 600;
      }

      /* utility strip links */
      .utility-link {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px;
        fill: #ffffff;
        font-weight: 500;
        opacity: 0.6;
      }

      .status-dot { fill: #007d48; }

      /* divider line */
      .divider { stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.06; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="960" height="480" class="bg"/>

  <!-- ═══════════════════════════ UTILITY STRIP ═══════════════════════════ -->
  <rect x="0" y="0" width="960" height="36" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="700" cy="18" r="3" class="status-dot"/>
  <text x="710" y="22" class="utility-link">Available for hire</text>
  <text x="885" y="22" class="utility-link" text-anchor="end">ADITYA ANAND</text>

  <!-- ═══════════════════════════ EDITORIAL GEOMETRY ═══════════════════════ -->
  <!-- concentric circles — right side -->
  <circle cx="840" cy="420" r="380" class="geo-thick"/>
  <circle cx="850" cy="410" r="280" class="geo-med"/>
  <circle cx="860" cy="400" r="200" class="geo-fine"/>
  <circle cx="870" cy="390" r="120" class="geo-med"/>
  <circle cx="880" cy="380" r="60"  class="geo-fine"/>

  <!-- horizontal rules -->
  <line x1="0" y1="240" x2="960" y2="240" class="geo-fine"/>
  <line x1="0" y1="370" x2="960" y2="370" class="geo-fine"/>

  <!-- angled editorial accent -->
  <line x1="520" y1="36"  x2="960" y2="370" class="geo-fine"/>
  <line x1="560" y1="36"  x2="960" y2="330" class="geo-fine"/>

  <!-- large subtle arc -->
  <path d="M 0 500 Q 200 350 400 400" class="geo-med"/>
  <path d="M 0 520 Q 250 340 450 410" class="geo-fine"/>

  <!-- dot grid pattern — bottom right -->
  <circle cx="880" cy="440" r="1.5" class="geo-med"/>
  <circle cx="900" cy="430" r="1.5" class="geo-med"/>
  <circle cx="920" cy="420" r="1.5" class="geo-med"/>
  <circle cx="910" cy="450" r="1.5" class="geo-med"/>
  <circle cx="930" cy="440" r="1.5" class="geo-med"/>

  <!-- ═══════════════════════════ DISPLAY HEADLINE ═════════════════════════ -->
  <!-- 96px Bebas Neue — Nike display-campaign tier -->
  <text x="80" y="195" class="headline">ADITYA</text>
  <text x="80" y="275" class="headline">ANAND</text>

  <!-- subhead -->
  <text x="80" y="325" class="subhead">FULL-STACK DEVELOPER  ·  OPEN SOURCE CONTRIBUTOR</text>

  <!-- tagline -->
  <text x="80" y="360" class="tagline">Code as craft. Performance as language.</text>

  <!-- ═══════════════════════════ CTA PILLS ═══════════════════════════════ -->
  <!-- primary pill — white on black -->
  <rect x="80" y="400" width="190" height="48" rx="30" class="pill-primary-bg"/>
  <text x="175" y="430" class="pill-primary-text" text-anchor="middle">GET IN TOUCH</text>

  <!-- secondary pill — soft-cloud -->
  <rect x="286" y="400" width="170" height="48" rx="30" class="pill-secondary-bg"/>
  <text x="371" y="430" class="pill-secondary-text" text-anchor="middle">LINKEDIN</text>

  <!-- secondary pill — soft-cloud -->
  <rect x="472" y="400" width="195" height="48" rx="30" class="pill-secondary-bg"/>
  <text x="570" y="430" class="pill-secondary-text" text-anchor="middle">VIEW REPOSITORIES</text>

  <!-- divider at bottom -->
  <line x1="80" y1="470" x2="880" y2="470" class="divider"/>

</svg>
