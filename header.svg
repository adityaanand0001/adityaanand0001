<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700&amp;display=swap');

      .bg { fill: #111111; }

      /* type */
      .headline {
        font-family: 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;
        font-size: 72px; fill: #ffffff; font-weight: 400; letter-spacing: 0;
      }
      .subhead {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 18px; fill: #9e9ea0; font-weight: 600;
      }
      .tagline {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px; fill: #707072; font-weight: 500;
      }
      .section-label {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px; fill: #ffffff; font-weight: 600; opacity: 0.7;
      }

      /* pills */
      .pill-white-bg { fill: #ffffff; }
      .pill-dark-bg { fill: #f5f5f5; fill-opacity: 0.1; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.08; }
      .pill-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px; fill: #111111; font-weight: 600;
      }
      .pill-text-dark {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px; fill: #ffffff; fill-opacity: 0.65; font-weight: 500;
      }

      /* hairline */
      .hairline { stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.05; }

      /* ── AGENT SWARM ── */
      .agent {
        fill: #00cec9;
        filter: drop-shadow(0 0 6px rgba(0,206,201,0.4));
      }
      .agent-alt {
        fill: #6c5ce7;
        filter: drop-shadow(0 0 6px rgba(108,92,231,0.35));
      }
      .agent-dim {
        fill: #ffffff;
        opacity: 0.3;
      }

      /* agent movements — each agent has unique drift + pulse */
      @keyframes driftA  { 0%,100% { transform: translate(0,0); }   25% { transform: translate(8px,-6px); } 50% { transform: translate(4px,10px); } 75% { transform: translate(-6px,4px); } }
      @keyframes driftB  { 0%,100% { transform: translate(0,0); }   25% { transform: translate(-10px,-4px); } 50% { transform: translate(-4px,-12px); } 75% { transform: translate(8px,-2px); } }
      @keyframes driftC  { 0%,100% { transform: translate(0,0); }   25% { transform: translate(6px,8px); } 50% { transform: translate(-8px,2px); } 75% { transform: translate(2px,-8px); } }
      @keyframes driftD  { 0%,100% { transform: translate(0,0); }   25% { transform: translate(-4px,10px); } 50% { transform: translate(10px,4px); } 75% { transform: translate(-8px,-6px); } }
      @keyframes driftE  { 0%,100% { transform: translate(0,0); }   25% { transform: translate(-6px,-8px); } 50% { transform: translate(6px,-4px); } 75% { transform: translate(4px,8px); } }

      @keyframes pulse  { 0%,100% { opacity: 1; r: 3; } 50% { opacity: 0.6; r: 4.5; } }
      @keyframes pulse2 { 0%,100% { opacity: 0.6; r: 2.5; } 50% { opacity: 1; r: 4; } }
      @keyframes glow   { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

      /* connection lines between agents — fade in/out */
      @keyframes connA { 0%,100% { opacity: 0.15; } 50% { opacity: 0.45; } }
      @keyframes connB { 0%,100% { opacity: 0.3; } 50% { opacity: 0.08; } }
      @keyframes connC { 0%,100% { opacity: 0.1; } 50% { opacity: 0.5; } }

      /* packet — data traveling along a connection */
      @keyframes packet1 { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="960" height="560" class="bg"/>

  <!-- utility strip -->
  <rect x="0" y="0" width="960" height="36" fill="#ffffff" fill-opacity="0.02"/>
  <text x="40" y="22" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#ffffff" font-weight="500" opacity="0.5">ADITYA ANAND  ·  AI ENGINEER  ·  SDE-1</text>
  <text x="920" y="22" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#ffffff" font-weight="500" opacity="0.4" text-anchor="end">Available for hire</text>

  <!-- ═══════════════════════════ AGENT SWARM — right side ═══════════════════════════ -->

  <!-- connection lines -->
  <line x1="700" y1="140" x2="820" y2="200" stroke="#00cec9" stroke-width="0.8" opacity="0.25" style="animation: connA 6s ease-in-out infinite"/>
  <line x1="820" y1="200" x2="880" y2="130" stroke="#6c5ce7" stroke-width="0.6" opacity="0.2" style="animation: connB 5s ease-in-out infinite"/>
  <line x1="700" y1="140" x2="760" y2="260" stroke="#00cec9" stroke-width="0.6" opacity="0.15" style="animation: connC 7s ease-in-out infinite"/>
  <line x1="880" y1="130" x2="900" y2="220" stroke="#6c5ce7" stroke-width="0.5" opacity="0.18" style="animation: connB 4.5s ease-in-out infinite"/>
  <line x1="760" y1="260" x2="850" y2="300" stroke="#00cec9" stroke-width="0.6" opacity="0.15" style="animation: connA 5.5s ease-in-out infinite"/>
  <line x1="820" y1="200" x2="900" y2="220" stroke="#6c5ce7" stroke-width="0.5" opacity="0.2" style="animation: connC 6.5s ease-in-out infinite"/>
  <line x1="700" y1="140" x2="850" y2="300" stroke="#ffffff" stroke-width="0.4" opacity="0.08" style="animation: connA 8s ease-in-out infinite"/>
  <line x1="880" y1="130" x2="760" y2="260" stroke="#ffffff" stroke-width="0.3" opacity="0.06" style="animation: connB 7.5s ease-in-out infinite"/>
  <line x1="900" y1="220" x2="760" y2="260" stroke="#00cec9" stroke-width="0.5" opacity="0.12" style="animation: connC 6s ease-in-out infinite"/>

  <!-- agents (circles) — each with unique drift + pulse -->
  <!-- agent cluster 1 -->
  <circle cx="700" cy="140" r="3" class="agent" style="animation: driftA 10s ease-in-out infinite, pulse 3s ease-in-out infinite"/>
  <circle cx="820" cy="200" r="2.5" class="agent-alt" style="animation: driftB 12s ease-in-out infinite, pulse2 4s ease-in-out infinite"/>
  <circle cx="880" cy="130" r="3" class="agent" style="animation: driftC 11s ease-in-out infinite, pulse 3.5s ease-in-out infinite"/>
  <circle cx="760" cy="260" r="2" class="agent-dim" style="animation: driftD 13s ease-in-out infinite, pulse2 5s ease-in-out infinite"/>
  <circle cx="900" cy="220" r="2.5" class="agent-alt" style="animation: driftE 9s ease-in-out infinite, pulse 4s ease-in-out infinite"/>
  <circle cx="850" cy="300" r="3" class="agent" style="animation: driftA 14s ease-in-out infinite, pulse2 3.5s ease-in-out infinite"/>

  <!-- peripheral agents — smaller, dimmer -->
  <circle cx="680" cy="180" r="1.5" class="agent-dim" opacity="0.2" style="animation: driftC 15s ease-in-out infinite, pulse2 6s ease-in-out infinite"/>
  <circle cx="920" cy="170" r="1.5" class="agent-dim" opacity="0.2" style="animation: driftB 14s ease-in-out infinite, pulse 5s ease-in-out infinite"/>
  <circle cx="840" cy="120" r="1.5" class="agent-dim" opacity="0.25" style="animation: driftE 12s ease-in-out infinite, pulse2 4.5s ease-in-out infinite"/>
  <circle cx="720" cy="300" r="1.5" class="agent-dim" opacity="0.15" style="animation: driftD 16s ease-in-out infinite, pulse 5.5s ease-in-out infinite"/>

  <!-- ═══════════════════════════ TYPOGRAPHY — left side ═══════════════════════ -->

  <text x="40" y="155" class="headline">ADITYA</text>
  <text x="40" y="220" class="headline">ANAND</text>

  <text x="40" y="265" class="subhead">AI ENGINEER  |  SDE-1</text>
  <text x="40" y="295" class="tagline">Autonomous agents. Intelligent systems. Clean code.</text>

  <!-- CTA pills -->
  <rect x="40" y="334" width="170" height="44" rx="22" class="pill-white-bg"/>
  <text x="125" y="362" class="pill-text" text-anchor="middle">GET IN TOUCH</text>

  <rect x="224" y="334" width="150" height="44" rx="22" class="pill-dark-bg"/>
  <text x="299" y="362" class="pill-text-dark" text-anchor="middle">LINKEDIN</text>

  <rect x="388" y="334" width="180" height="44" rx="22" class="pill-dark-bg"/>
  <text x="478" y="362" class="pill-text-dark" text-anchor="middle">VIEW REPOSITORIES</text>

  <!-- divider -->
  <line x1="40" y1="415" x2="920" y2="415" class="hairline"/>

  <!-- ═══════════════════════════ TECH STACK ═══════════════════════════════════ -->

  <text x="40" y="455" class="section-label">TECH STACK</text>

  <!-- Row 1 — primary skills (white pills) -->
  <rect x="40" y="472" width="80" height="30" rx="15" class="pill-white-bg"/>
  <text x="80" y="492" class="pill-text" text-anchor="middle">Python</text>

  <rect x="132" y="472" width="90" height="30" rx="15" class="pill-white-bg"/>
  <text x="177" y="492" class="pill-text" text-anchor="middle">TypeScript</text>

  <rect x="234" y="472" width="68" height="30" rx="15" class="pill-white-bg"/>
  <text x="268" y="492" class="pill-text" text-anchor="middle">React</text>

  <rect x="314" y="472" width="82" height="30" rx="15" class="pill-white-bg"/>
  <text x="355" y="492" class="pill-text" text-anchor="middle">Next.js</text>

  <rect x="408" y="472" width="90" height="30" rx="15" class="pill-white-bg"/>
  <text x="453" y="492" class="pill-text" text-anchor="middle">Node.js</text>

  <!-- Row 2 — secondary (dark pills) -->
  <rect x="40" y="514" width="86" height="30" rx="15" class="pill-dark-bg"/>
  <text x="83" y="534" class="pill-text-dark" text-anchor="middle">LangChain</text>

  <rect x="138" y="514" width="100" height="30" rx="15" class="pill-dark-bg"/>
  <text x="188" y="534" class="pill-text-dark" text-anchor="middle">LLMs / RAG</text>

  <rect x="250" y="514" width="72" height="30" rx="15" class="pill-dark-bg"/>
  <text x="286" y="534" class="pill-text-dark" text-anchor="middle">Docker</text>

  <rect x="334" y="514" width="56" height="30" rx="15" class="pill-dark-bg"/>
  <text x="362" y="534" class="pill-text-dark" text-anchor="middle">AWS</text>

  <rect x="402" y="514" width="94" height="30" rx="15" class="pill-dark-bg"/>
  <text x="449" y="534" class="pill-text-dark" text-anchor="middle">PostgreSQL</text>

  <rect x="508" y="514" width="86" height="30" rx="15" class="pill-dark-bg"/>
  <text x="551" y="534" class="pill-text-dark" text-anchor="middle">MongoDB</text>

</svg>
