<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700&amp;display=swap');

      .bg { fill: #111111; }

      /* editorial geometric "photography" — Nike campaign stand-in */
      .geo-thick { fill: none; stroke: #ffffff; stroke-width: 2; stroke-opacity: 0.06; }
      .geo-med  { fill: none; stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.04; }
      .geo-fine { fill: none; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.03; }

      /* display headline — Bebas Neue, 96px */
      .headline {
        font-family: 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;
        font-size: 96px; fill: #ffffff; font-weight: 400; letter-spacing: 0px;
      }

      /* subhead — Inter, 20px, stone */
      .subhead {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 20px; fill: #9e9ea0; font-weight: 600;
      }

      /* tagline — Inter, 16px, mute */
      .tagline {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px; fill: #707072; font-weight: 500;
      }

      /* CTA pills */
      .pill-primary-bg { fill: #ffffff; }
      .pill-secondary-bg { fill: #f5f5f5; }
      .pill-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px; fill: #111111; font-weight: 600;
      }

      /* utility strip */
      .utility-link {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px; fill: #ffffff; font-weight: 500; opacity: 0.6;
      }
      .status-dot { fill: #007d48; }

      /* dividers */
      .divider { stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.06; }

      /* section label */
      .section-label {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px; fill: #ffffff; font-weight: 600; opacity: 0.8;
      }

      /* skill chip — active (ink bg) */
      .chip-ink-bg { fill: #ffffff; }
      .chip-ink-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px; fill: #111111; font-weight: 600;
      }

      /* skill chip — default (soft-cloud bg) */
      .chip-cloud-bg { fill: #f5f5f5; fill-opacity: 0.12; stroke: #ffffff; stroke-width: 0.5; stroke-opacity: 0.1; }
      .chip-cloud-text {
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px; fill: #ffffff; fill-opacity: 0.7; font-weight: 500;
      }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="960" height="640" class="bg"/>

  <!-- ═══════════════════════════ UTILITY STRIP ═══════════════════════════ -->
  <rect x="0" y="0" width="960" height="36" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="700" cy="18" r="3" class="status-dot"/>
  <text x="710" y="22" class="utility-link">Available for hire</text>
  <text x="885" y="22" class="utility-link" text-anchor="end">ADITYA ANAND</text>

  <!-- ═══════════════════════════ EDITORIAL GEOMETRY ═══════════════════════ -->
  <!-- concentric circles — right side -->
  <circle cx="840" cy="380" r="380" class="geo-thick"/>
  <circle cx="850" cy="370" r="280" class="geo-med"/>
  <circle cx="860" cy="360" r="200" class="geo-fine"/>
  <circle cx="870" cy="350" r="120" class="geo-med"/>
  <circle cx="880" cy="340" r="60"  class="geo-fine"/>

  <!-- horizontal rules -->
  <line x1="0" y1="210" x2="960" y2="210" class="geo-fine"/>
  <line x1="0" y1="330" x2="960" y2="330" class="geo-fine"/>

  <!-- angled editorial accent -->
  <line x1="520" y1="36"  x2="960" y2="330" class="geo-fine"/>
  <line x1="560" y1="36"  x2="960" y2="290" class="geo-fine"/>

  <!-- dot grid — bottom right -->
  <circle cx="880" cy="580" r="1.5" class="geo-med"/>
  <circle cx="900" cy="570" r="1.5" class="geo-med"/>
  <circle cx="920" cy="560" r="1.5" class="geo-med"/>
  <circle cx="910" cy="590" r="1.5" class="geo-med"/>
  <circle cx="930" cy="580" r="1.5" class="geo-med"/>

  <!-- ═══════════════════════════ DISPLAY HEADLINE ═════════════════════════ -->
  <text x="80" y="175" class="headline">ADITYA</text>
  <text x="80" y="255" class="headline">ANAND</text>

  <!-- subhead -->
  <text x="80" y="300" class="subhead">AI ENGINEER  |  SDE-1</text>

  <!-- tagline -->
  <text x="80" y="335" class="tagline">Code as craft. Performance as language.</text>

  <!-- ═══════════════════════════ CTA PILLS ═══════════════════════════════ -->
  <rect x="80" y="370" width="190" height="48" rx="30" class="pill-primary-bg"/>
  <text x="175" y="400" class="pill-text" text-anchor="middle">GET IN TOUCH</text>

  <rect x="286" y="370" width="170" height="48" rx="30" class="pill-secondary-bg"/>
  <text x="371" y="400" class="pill-text" text-anchor="middle">LINKEDIN</text>

  <rect x="472" y="370" width="195" height="48" rx="30" class="pill-secondary-bg"/>
  <text x="570" y="400" class="pill-text" text-anchor="middle">VIEW REPOSITORIES</text>

  <!-- divider -->
  <line x1="80" y1="445" x2="880" y2="445" class="divider"/>

  <!-- ═══════════════════════════ TECH STACK ═══════════════════════════════ -->
  <text x="80" y="485" class="section-label">TECH STACK</text>

  <!-- Row 1 — primary skills (ink/white pills) -->
  <rect x="80" y="502" width="88" height="32" rx="16" class="chip-ink-bg"/>
  <text x="124" y="523" class="chip-ink-text" text-anchor="middle">Python</text>

  <rect x="178" y="502" width="100" height="32" rx="16" class="chip-ink-bg"/>
  <text x="228" y="523" class="chip-ink-text" text-anchor="middle">TypeScript</text>

  <rect x="288" y="502" width="74" height="32" rx="16" class="chip-ink-bg"/>
  <text x="325" y="523" class="chip-ink-text" text-anchor="middle">React</text>

  <rect x="372" y="502" width="90" height="32" rx="16" class="chip-ink-bg"/>
  <text x="417" y="523" class="chip-ink-text" text-anchor="middle">Next.js</text>

  <rect x="472" y="502" width="100" height="32" rx="16" class="chip-ink-bg"/>
  <text x="522" y="523" class="chip-ink-text" text-anchor="middle">Node.js</text>

  <!-- Row 2 — secondary skills (soft-cloud pills) -->
  <rect x="80" y="546" width="86" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="123" y="567" class="chip-cloud-text" text-anchor="middle">LangChain</text>

  <rect x="176" y="546" width="104" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="228" y="567" class="chip-cloud-text" text-anchor="middle">LLMs / RAG</text>

  <rect x="290" y="546" width="80" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="330" y="567" class="chip-cloud-text" text-anchor="middle">Docker</text>

  <rect x="380" y="546" width="70" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="415" y="567" class="chip-cloud-text" text-anchor="middle">AWS</text>

  <rect x="460" y="546" width="104" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="512" y="567" class="chip-cloud-text" text-anchor="middle">PostgreSQL</text>

  <rect x="574" y="546" width="96" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="622" y="567" class="chip-cloud-text" text-anchor="middle">MongoDB</text>

  <!-- Row 3 — more secondary -->
  <rect x="80"  y="590" width="74" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="117" y="611" class="chip-cloud-text" text-anchor="middle">GraphQL</text>

  <rect x="164" y="590" width="56" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="192" y="611" class="chip-cloud-text" text-anchor="middle">Git</text>

  <rect x="230" y="590" width="64" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="262" y="611" class="chip-cloud-text" text-anchor="middle">Linux</text>

  <rect x="304" y="590" width="84" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="346" y="611" class="chip-cloud-text" text-anchor="middle">Tailwind</text>

  <rect x="398" y="590" width="72" height="32" rx="16" class="chip-cloud-bg"/>
  <text x="434" y="611" class="chip-cloud-text" text-anchor="middle">Figma</text>

</svg>
