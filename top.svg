<svg viewBox="0 0 880 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .accent { fill: #f78166; }

      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 30px; fill: #f0f6fc; font-weight: 600; letter-spacing: -0.3px;
      }
      .role {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px; fill: #8b949e; font-weight: 500;
      }
      .tagline {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px; fill: #484f58; font-weight: 400;
      }
    </style>
  </defs>

  <rect width="880" height="130" class="bg"/>

  <!-- left edge accent -->
  <rect x="0" y="0" width="3" height="130" class="accent"/>

  <text x="40" y="52" class="name">Aditya Anand</text>
  <text x="40" y="78" class="role">Full Stack AI Engineer — SDE-1</text>
  <text x="40" y="104" class="tagline">Building autonomous AI agents, RAG pipelines, and full-stack systems.</text>

</svg>
