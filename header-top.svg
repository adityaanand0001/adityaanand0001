<svg viewBox="0 0 880 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .accent { fill: #f78166; }
      .accent-green { fill: #3fb950; }

      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 30px; fill: #f0f6fc; font-weight: 600; letter-spacing: -0.3px;
      }
      .role {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px; fill: #8b949e; font-weight: 500;
      }
      .tagline {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px; fill: #484f58; font-weight: 400;
      }
      .status-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px; fill: #3fb950; font-weight: 600;
      }
      .status-bg { fill: #3fb950; fill-opacity: 0.1; }
    </style>
  </defs>

  <rect width="880" height="140" class="bg"/>

  <rect x="0" y="0" width="3" height="140" class="accent"/>

  <text x="40" y="50" class="name">Aditya Anand</text>

  <!-- Open to Work badge -->
  <rect x="230" y="32" width="110" height="22" rx="11" class="status-bg"/>
  <circle cx="244" cy="43" r="4" class="accent-green"/>
  <text x="254" y="47" class="status-text">Open to Work</text>

  <text x="40" y="78" class="role">AI Engineer — Agentic Systems, LLMs, Voice AI</text>
  <text x="40" y="104" class="tagline">Building autonomous agents that perceive, reason, and act. SDE-1 @.monks.</text>

</svg>
