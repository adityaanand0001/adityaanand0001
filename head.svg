<svg width="880" height="160" viewBox="0 0 880 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }

      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 32px; fill: #f0f6fc; font-weight: 700; letter-spacing: -0.5px;
      }
      .accent-dot { fill: #58a6ff; }
      .role {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px; fill: #8b949e; font-weight: 600;
      }
      .bio {
        font-family: 'Consolas', 'Cascadia Code', 'JetBrains Mono', monospace;
        font-size: 12px; fill: #484f58; font-weight: 500;
      }

      .tag-bg { fill: #1f6feb; fill-opacity: 0.12; }
      .tag-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 11px; fill: #58a6ff; font-weight: 600;
      }

      .stat-num {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 48px; fill: #f0f6fc; font-weight: 700;
      }
      .stat-label {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 11px; fill: #484f58; font-weight: 600; letter-spacing: 0.5px;
      }

      .div { stroke: #21262d; stroke-width: 1; }

      .node { fill: #58a6ff; opacity: 0.5; }
      .node-green { fill: #3fb950; opacity: 0.5; }
      .edge { stroke: #30363d; stroke-width: 0.6; }
    </style>
  </defs>

  <rect width="880" height="160" class="bg"/>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.4" stroke-opacity="0.3"/>
  </pattern>
  <rect width="880" height="160" fill="url(#grid)"/>

  <!-- LEFT — identity -->
  <text x="36" y="52" class="name">Aditya Anand<tspan class="accent-dot">.</tspan></text>
  <text x="36" y="78" class="role">Full Stack AI Engineer  ·  SDE-1</text>
  <text x="36" y="100" class="bio">// autonomous agents · LLMs · full-stack systems</text>

  <!-- tags -->
  <rect x="36" y="118" width="82" height="22" rx="3" class="tag-bg"/>
  <text x="77" y="133" class="tag-text" text-anchor="middle">AI Agents</text>

  <rect x="126" y="118" width="52" height="22" rx="3" class="tag-bg"/>
  <text x="152" y="133" class="tag-text" text-anchor="middle">LLMs</text>

  <rect x="186" y="118" width="72" height="22" rx="3" class="tag-bg"/>
  <text x="222" y="133" class="tag-text" text-anchor="middle">Full-Stack</text>

  <rect x="266" y="118" width="78" height="22" rx="3" class="tag-bg"/>
  <text x="305" y="133" class="tag-text" text-anchor="middle">Open Source</text>

  <!-- RIGHT — real stats, only positives -->
  <line x1="580" y1="20" x2="580" y2="140" class="div"/>

  <!-- agent nodes -->
  <circle cx="555" cy="55" r="3" class="node"/>
  <circle cx="555" cy="105" r="3" class="node-green"/>
  <line x1="555" y1="55" x2="555" y2="105" class="edge"/>

  <text x="650" y="74" class="stat-num">4</text>
  <text x="650" y="92" class="stat-label">REPOSITORIES</text>

  <text x="780" y="74" class="stat-num">800+</text>
  <text x="780" y="92" class="stat-label">COMMITS</text>

</svg>
